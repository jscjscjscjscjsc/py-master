<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>修行阁 · PyMaster</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/cultivation.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/cultivation_game.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/music.css') }}">
</head>
<body class="workbench-page cultivation-page">

<header class="wb-top">
  <div class="wb-brand">
    <span class="spark" aria-hidden="true">
      {# 品牌记号用矢量画，不用 emoji：emoji 在深色界面里会显得廉价，且各系统渲染不一致 #}
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2.6 L14 9.4 L20.8 12 L14 14.6 L12 21.4 L10 14.6 L3.2 12 L10 9.4 Z"/>
        <circle cx="12" cy="12" r="1.6" fill="currentColor" stroke="none"/>
      </svg>
    </span>
    <span>修行阁</span>
  </div>
  <div class="wb-right">
    <a class="wb-link" href="/progress">学习仪表盘</a>
    <a class="wb-link" href="/training">刷题中心</a>
    <a class="wb-link" href="/coach">星辰教练</a>
    <a class="wb-link" href="/dashboard">返回主页</a>
    <span class="wb-link" style="cursor:default" id="whoami">{{ username }}</span>
  </div>
</header>

<div class="wb-layout wide">
  {# 天头：卷轴的起首。标题用楷/宋、字距放开，右边压一枚朱文印 #}
  <div class="scroll-head">
    <div class="title">修行阁</div>
    <div class="seal">神识<br>画像</div>
    <div class="sub">十境三十级 · 你所练的每一分修为，都会在这里显形</div>
  </div>
  <div class="scroll-rule"><i></i></div>

  <main id="cult-root" class="cult-wrap">
    <div class="empty-note">正在推演你的修行数据…</div>
  </main>
</div>

<script src="{{ url_for('static', filename='js/ui_confirm.js') }}"></script>
<script src="{{ url_for('static', filename='js/portrait.js') }}"></script>
<script src="{{ url_for('static', filename='js/cultivation.js') }}"></script>
<script src="{{ url_for('static', filename='js/cultivation_game.js') }}"></script>
<script src="{{ url_for('static', filename='js/music_player.js') }}"></script>
</body>
</html>
