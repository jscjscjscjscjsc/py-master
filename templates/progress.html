<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>学习仪表盘 · PyMaster</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/cultivation.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/cultivation_game.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/music.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/training.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/atmosphere.css') }}">
</head>
<body class="workbench-page">

<header class="wb-top">
  <div class="wb-brand">
    <span class="spark" aria-hidden="true">
      {# 仪表盘标记用矢量画：emoji 在深色界面里发虚、各系统渲染还不一致 #}
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 20 V13"/><path d="M10 20 V6"/><path d="M16 20 V10"/><path d="M21 20 H3"/>
      </svg>
    </span>
    <span>学习仪表盘</span>
  </div>
  <div class="wb-right">
    <a class="wb-link" href="/cultivation">修行阁</a>
    <a class="wb-link" href="/training">刷题中心</a>
    <a class="wb-link" href="/coach">星辰教练</a>
    <a class="wb-link" href="/dashboard">返回主页</a>
    <span class="wb-link" style="cursor:default">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="1.7" stroke-linecap="round" style="vertical-align:-2px;margin-right:4px">
        <circle cx="12" cy="8.5" r="3.6"/><path d="M4.5 20 C5.6 16.4 8.4 14.6 12 14.6 C15.6 14.6 18.4 16.4 19.5 20"/>
      </svg>{{ username }}</span>
  </div>
</header>

<div class="wb-layout wide">
  <main id="dash-root">
    <div class="empty-note">正在统计你的学习数据…</div>
  </main>
</div>

<script src="{{ url_for('static', filename='js/ui_confirm.js') }}"></script>
<script src="{{ url_for('static', filename='js/portrait.js') }}"></script>
<script src="{{ url_for('static', filename='js/cultivation.js') }}"></script>
<script src="{{ url_for('static', filename='js/cultivation_game.js') }}"></script>
<script src="{{ url_for('static', filename='js/music_player.js') }}"></script>
<script src="{{ url_for('static', filename='js/progress.js') }}"></script>
<script src="{{ url_for('static', filename='js/atmosphere.js') }}"></script>
<script src="{{ url_for('static', filename='js/ai_notice.js') }}"></script>
</body>
</html>
